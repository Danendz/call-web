# Checks, builds and releases the native app. Pull requests get fmt, clippy and tests on macOS. The macOS and Windows
# release builds only build (each extra cargo command is another full compile, ~20 min on a Windows runner): test
# builds run on `build/**` branches (push a branch there to get installable artifacts) and when started by hand from
# the Actions tab. A merge to `main` that bumps app/Cargo.toml's version (from a `bump/*` branch) builds and publishes
# a release with Velopack to the releases bucket, served at call.danendz.com/updates (packaging/release.sh), then a
# GitHub release `native-v<version>` with that version's native/CHANGELOG.md section and the installers. Windows
# is unsigned (SmartScreen needs "Run anyway" on the first install); macOS is signed with our self-signed certificate
# (right-click → Open on the first install). The first build of a cache downloads prebuilt WebRTC (~200 MB).
name: native

on:
  pull_request:
    paths: ["native/**", "shared/**", "scripts/fixtures.ts", ".github/workflows/native.yml"]
  push:
    branches: [main, "build/**"]
    paths: ["native/**", "shared/**", "scripts/fixtures.ts", ".github/workflows/native.yml"]
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  # Never cut off a release halfway through its upload
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run fixtures -- --check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
        working-directory: native

  # Every version needs its changelog section, checked on the PR so a bump can't merge without one
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' native/app/Cargo.toml)
          grep -q "^## $version " native/CHANGELOG.md || { echo "::error::native/CHANGELOG.md has no section for $version"; exit 1; }

  check:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/build/')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native }
      - run: cargo build --release --locked
      - if: runner.os == 'macOS'
        run: packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: call-danya-${{ runner.os }}
          path: |
            native/target/release/call-danya-macos.zip
            native/target/release/call-danya.exe
          if-no-files-found: error

  # Is app/Cargo.toml's version missing from either channel of the published feed? Only then is a release built.
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' native/app/Cargo.toml)
          release=false
          for channel in win osx; do
            curl -fsS "https://call.danendz.com/updates/releases.$channel.json" | grep -q "\"Version\": *\"$version\"" || release=true
          done
          echo "$version: release=$release"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    needs: [version, changelog]
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      # Same version as the velopack crate in app/Cargo.toml
      - run: dotnet tool install -g vpk --version 1.2.161
      - run: cargo build --release --locked
      - run: packaging/release.sh
        env:
          RELEASES_ENDPOINT: ${{ secrets.RELEASES_ENDPOINT }}
          RELEASES_BUCKET: ${{ secrets.RELEASES_BUCKET }}
          RELEASES_KEY_ID: ${{ secrets.RELEASES_KEY_ID }}
          RELEASES_SECRET: ${{ secrets.RELEASES_SECRET }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      # For the GitHub release; nothing when this channel already had the version
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            native/target/velopack/*-Setup.*
            native/target/velopack/*-Portable.zip
          if-no-files-found: ignore

  # Only once both OSes are published. A private repo's release is a changelog and a backup copy of the installers
  # for us; she installs and updates from call.danendz.com.
  github-release:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: installers-*, merge-multiple: true, path: installers }
      - run: |
          awk -v v="$VERSION" '/^## /{ if (p) exit; if ($2 == v) { p = 1; next } } p' native/CHANGELOG.md > notes.md
          tag="native-v$VERSION"
          gh release view "$tag" > /dev/null 2>&1 ||
            gh release create "$tag" --target "$GITHUB_SHA" --title "Call Danya $VERSION" --notes-file notes.md
          if [ -n "$(ls installers 2>/dev/null)" ]; then gh release upload "$tag" installers/* --clobber; fi
