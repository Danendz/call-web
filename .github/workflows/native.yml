# Checks, builds and releases the native app. Pull requests get the fixtures check, cargo audit and the changelog
# check in one job, and fmt, clippy and tests on macOS once out of draft. Nothing runs on `main`: builds and releases
# only run from their own branches, so CI minutes go to them only when asked for (macOS minutes count 10x and Windows
# 2x against the Actions quota).
# - `build/**`: every push builds macOS, Windows and the signed Android APK and uploads installable artifacts. The
#   builds only build (each extra cargo command is another full compile, ~20 min on a Windows runner).
# - `release/<version>`: pushing `main` there (`git push origin main:release/<version>`) builds and publishes that
#   version with Velopack to the releases bucket, served at call.danendz.com/updates (packaging/release.sh), and the
#   APK with its android.json (packaging/android/release.sh), then a GitHub release `native-v<version>` with that version's native/CHANGELOG.md section and the installers. The commit
#   must already be on `main` and the branch name must match app/Cargo.toml's version.
# Pushes to these branches have no path filter, so a branch with no new commits still builds. Windows is unsigned
# (SmartScreen needs "Run anyway" on the first install); macOS is signed with our self-signed certificate
# (right-click → Open on the first install). Rust caches are shared by key across jobs and start from the ones
# native-cache.yml saves on `main`; the first build of a cache downloads prebuilt WebRTC (~200 MB).
name: native

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "native/**"
      - "shared/**"
      - "scripts/fixtures.ts"
      - "scripts/denoise-wasm.ts"
      - "web/src/call/denoise/**"
      - ".github/workflows/native.yml"
      - ".github/actions/**"
  push:
    branches: ["build/**", "release/**"]
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  # Never cut off a release halfway through its upload
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  # One job, since each job is billed as at least a whole minute
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: taiki-e/install-action@cargo-audit
      - run: npm ci
      - run: npm run fixtures -- --check
      - run: cargo audit
        working-directory: native
      # The web app's noise suppression is committed WASM built from native/crates/denoise
      - run: npx tsx scripts/denoise-wasm.ts --check
      - run: cargo audit
        working-directory: native/wasm/denoise
      # Every version needs its changelog section, checked on the PR so a bump can't merge without one
      - run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' native/app/Cargo.toml)
          grep -q "^## $version " native/CHANGELOG.md || { echo "::error::native/CHANGELOG.md has no section for $version"; exit 1; }

  check:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native, shared-key: check }
      - run: cargo fmt --check
      # The build cache keeps sherpa-onnx-sys's build-script result and its folders, but not the library files in them;
      # the build script only checks the folder, so remove it to make it download again
      - run: ls target/sherpa-onnx-prebuilt/*/lib/libsherpa-onnx-c-api.a >/dev/null 2>&1 || { rm -rf target/sherpa-onnx-prebuilt; cargo clean -p sherpa-onnx-sys; }
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The Android library on Linux, where the NDK brings its own clang. Linted only: the APK is built for releases
  check-android:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android
        with: { cache-key: check-android }
      - run: cargo ndk -t arm64-v8a -P 29 clippy -p call-danya --lib -p engine --locked -- -D warnings
        working-directory: native

  build:
    if: startsWith(github.ref, 'refs/heads/build/')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native, shared-key: release }
      - run: cargo build --release --locked
      - if: runner.os == 'macOS'
        run: packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: call-danya-${{ runner.os }}
          path: |
            native/target/release/call-danya-macos.zip
            native/target/release/call-danya.exe
          if-no-files-found: error

  build-android:
    if: startsWith(github.ref, 'refs/heads/build/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android
        with: { cache-key: release-android }
      - run: native/packaging/android/release.sh build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: call-danya-Android
          path: native/target/android/*.apk
          if-no-files-found: error

  # Only reviewed code is released, under the version the branch names. Is that version missing from any channel of
  # the published feeds (Windows, macOS, Android)? Only then is a release built.
  version:
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: check
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' native/app/Cargo.toml)
          grep -q "^## $version " native/CHANGELOG.md || { echo "::error::native/CHANGELOG.md has no section for $version"; exit 1; }
          [ "${GITHUB_REF_NAME#release/}" = "$version" ] ||
            { echo "::error::Branch $GITHUB_REF_NAME doesn't match app/Cargo.toml's version $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_SHA isn't on main; merge the bump first, then push main to $GITHUB_REF_NAME"; exit 1; }
          release=false
          for channel in win osx; do
            curl -fsS "https://call.danendz.com/updates/releases.$channel.json" | grep -q "\"Version\": *\"$version\"" || release=true
          done
          curl -fsS https://call.danendz.com/updates/android.json | grep -q "\"version\": *\"$version\"" || release=true
          echo "$version: release=$release"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: native, shared-key: release }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      # Same version as the velopack crate in app/Cargo.toml
      - run: dotnet tool install -g vpk --version 1.2.161
      - run: cargo build --release --locked
      - run: packaging/release.sh
        env:
          RELEASES_ENDPOINT: ${{ secrets.RELEASES_ENDPOINT }}
          RELEASES_BUCKET: ${{ secrets.RELEASES_BUCKET }}
          RELEASES_KEY_ID: ${{ secrets.RELEASES_KEY_ID }}
          RELEASES_SECRET: ${{ secrets.RELEASES_SECRET }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      # For the GitHub release; nothing when this channel already had the version
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            native/target/velopack/*-Setup.*
            native/target/velopack/*-Portable.zip
          if-no-files-found: ignore

  release-android:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android
        with: { cache-key: release-android }
      - run: native/packaging/android/release.sh
        env:
          RELEASES_ENDPOINT: ${{ secrets.RELEASES_ENDPOINT }}
          RELEASES_BUCKET: ${{ secrets.RELEASES_BUCKET }}
          RELEASES_KEY_ID: ${{ secrets.RELEASES_KEY_ID }}
          RELEASES_SECRET: ${{ secrets.RELEASES_SECRET }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # For the GitHub release; nothing when Android already had the version
      - uses: actions/upload-artifact@v4
        with:
          name: installers-Android
          path: native/target/android/call-danya-*.apk
          if-no-files-found: ignore

  # Only once every platform is published. A private repo's release is a changelog and a backup copy of the installers
  # for us; users install and update from call.danendz.com.
  github-release:
    needs: [version, release, release-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: installers-*, merge-multiple: true, path: installers }
      - run: |
          awk -v v="$VERSION" '/^## /{ if (p) exit; if ($2 == v) { p = 1; next } } p' native/CHANGELOG.md > notes.md
          tag="native-v$VERSION"
          gh release view "$tag" > /dev/null 2>&1 ||
            gh release create "$tag" --target "$GITHUB_SHA" --title "Call Danya $VERSION" --notes-file notes.md
          if [ -n "$(ls installers 2>/dev/null)" ]; then gh release upload "$tag" installers/* --clobber; fi
