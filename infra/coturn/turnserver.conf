# coturn config for turn-hk.danendz.com on the Alibaba Cloud Hong Kong server.
# Copy to /etc/turnserver.conf and replace the CHANGE_ME values.

listening-port=3478
tls-listening-port=5349

# The server sits behind 1:1 NAT: eth0 has only the private IP (`ip -4 addr`), the public IP is mapped onto it.
# Bind to the private IP (also keeps coturn off IPv6, which the firewall doesn't open) and advertise public/private.
listening-ip=CHANGE_ME_PRIVATE_IP
relay-ip=CHANGE_ME_PRIVATE_IP
external-ip=CHANGE_ME_PUBLIC_IP/CHANGE_ME_PRIVATE_IP

# Relay ports. 2 users need only a handful; keep the range small so the firewall rule is tight.
min-port=49160
max-port=49200

realm=turn.danendz.com
server-name=turn.danendz.com
fingerprint

# Time-limited credentials minted by the app server (server/turn.ts).
# Must equal the TURN_SECRET variable on Railway. Generate with: openssl rand -hex 32
use-auth-secret
static-auth-secret=CHANGE_ME_SECRET

# Let's Encrypt cert, copied by the certbot deploy hook (see infra/README.md) so the turnserver user can read it.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# Abuse limits: this box is only for two people.
user-quota=12
total-quota=60
max-bps=3000000
stale-nonce=600

# Never relay into private / loopback networks (stops people using the relay to reach the VPS's local services).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1

no-cli
simple-log
log-file=/var/log/turnserver/turnserver.log
