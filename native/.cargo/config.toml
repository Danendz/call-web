# WebRTC's macOS code is Objective-C categories in a static library: without -ObjC the linker drops them and the
# app crashes creating the peer connection factory ("unrecognized selector stringForStdString:").
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-ObjC"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-ObjC"]
