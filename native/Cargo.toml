[workspace]
resolver = "3"
members = ["crates/*", "app"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Input from the server or the other person must never take the app down
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# LiveKit's webrtc-sys with a hook into the mic's audio after WebRTC's processing, where DeepFilterNet runs
# (`crates/denoise`), and a switch for WebRTC's own noise suppression. Fork of v0.3.53; only the C++ shim changes.
[patch.crates-io]
webrtc-sys = { git = "https://github.com/Danendz/rust-sdks", rev = "1f3825243964f4bc31681e44c08384b2b619f30c" }
