[workspace]
resolver = "3"
members = ["crates/*", "app"]
# Third-party code we patch (vendor/README.md): built as a dependency, not linted or formatted as ours
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Input from the server or the other person must never take the app down
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# LiveKit's webrtc-sys with a hook into the mic's audio after WebRTC's processing, where DeepFilterNet runs
# (`crates/denoise`), and a switch for WebRTC's own noise suppression. The published crate plus vendor/webrtc-sys.patch;
# why and how to update it: vendor/README.md.
[patch.crates-io]
webrtc-sys = { path = "vendor/webrtc-sys" }
