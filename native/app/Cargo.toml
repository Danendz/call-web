[package]
name = "call-danya"
version = "0.4.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
engine = { path = "../crates/engine" }
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
slint = { version = "=1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "renderer-skia-opengl",
] }
sys-locale = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
url = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
skia-safe = { version = "=0.153.3", default-features = false }
# Slint's own wgpu, only to turn on WGSL for the video shader in gpu.rs; keep the version Slint takes
wgpu = { version = "=30.0.1", default-features = false, features = ["wgsl"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = [
    "backend-winit",
    # Only for the window attributes hook in window.rs; it's why slint is pinned exactly
    "unstable-winit-030",
    # Skia over wgpu (Metal, D3D12, Vulkan), OpenGL kept as the fallback; see window.rs
    "renderer-skia",
    "unstable-wgpu-30",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
velopack = "=1.2.161"

# The UIScene lifecycle iOS 27 requires, which winit 0.30 lacks, the edit menu, the call's audio route and CallKit
# (src/ios/)
[target.'cfg(target_os = "ios")'.dependencies]
# The update check (ios/update.rs); the engine's model downloads already bring it in
ureq = { version = "3", default-features = false, features = ["rustls"] }
block2 = "0.6"
objc2 = "0.6"
objc2-call-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "objc2-avf-audio",
    "CXAction",
    "CXAnswerCallAction",
    "CXCallAction",
    "CXCallController",
    "CXCallUpdate",
    "CXEndCallAction",
    "CXError",
    "CXHandle",
    "CXProvider",
    "CXProviderConfiguration",
    "CXSetHeldCallAction",
    "CXSetMutedCallAction",
    "CXStartCallAction",
    "CXTransaction",
] }
objc2-avf-audio = { version = "0.3", default-features = false, features = [
    "std",
    "AVAudioSession",
    "AVAudioSessionRoute",
    "AVAudioSessionTypes",
] }
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "UIAction",
    "UIApplication",
    "UIDevice",
    "UIEditMenuInteraction",
    "UIGeometry",
    "UIImage",
    "UIInteraction",
    "UIMenu",
    "UIMenuElement",
    "UIResponder",
    "UIScene",
    "UISceneOptions",
    "UISceneSession",
    "UIView",
    "UIWindow",
    "UIWindowScene",
] }

[target.'cfg(target_os = "android")'.dependencies]
# Skia over Vulkan through wgpu, or over OpenGL, picked at runtime by our patched backend (vendor/README.md)
slint = { version = "=1.18.1", default-features = false, features = ["backend-android-activity-06", "unstable-wgpu-30"] }
# For the backend's `set_requested_graphics_api`, which `slint` doesn't re-export, and the API it takes
i-slint-backend-android-activity = "=1.18.1"
i-slint-core = "=1.18.1"
# The version LiveKit's libwebrtc takes its JavaVM in
jni = "0.21"
# To read the system's fonts.xml; Slint's font library already brings it in
roxmltree = "0.21"

# The desktop app is `main.rs`; Android builds this library as a cdylib (`--crate-type cdylib`, see android/)
[lib]
name = "call_danya"

[[bin]]
name = "call-danya"
path = "src/main.rs"

[features]
# Slint's embedded MCP server for driving and screenshotting the app in development (SLINT_MCP_PORT=<port>); see
# dev/mcp.sh. Never in release builds: it lets anything on localhost control the app.
dev-mcp = ["slint/mcp"]

[build-dependencies]
slint-build = "=1.18.1"
# Android: exports WebRTC's JNI symbols from our library, which webrtc-sys can't do for us
webrtc-sys-build = "=0.3.21"
# Windows: puts the icon into the .exe, which Explorer, the Start menu and the taskbar show
winresource = "0.1"

[lints]
workspace = true
