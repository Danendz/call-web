[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
serde_json.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# rustls's crypto for wss://. Nothing else picks one on Android (velopack's ureq does on desktop), and without it the
# first connection to an https server panics
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tracing = "0.1"
url = "2"
libwebrtc = "0.4"
# The hook into the mic's audio after WebRTC's processing; patched in `native/Cargo.toml`
webrtc-sys = "0.3.53"
# DeepFilterNet3 noise suppression on that audio
denoise = { path = "../denoise" }
# The setup screen's mic level; WebRTC captures nothing until a call
cpal = "0.18.2"
# On-device speech recognition (SenseVoice). Static on desktop; Android only has its shared build, whose .so files
# Gradle packs into the APK
sherpa-onnx = { version = "2.0.1", default-features = false }
# Downloading that model, and checking it
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
# Live subtitles' translation: Firefox's Bergamot engine (vendor/bergamot) is WebAssembly; build.rs compiles it ahead
# of time, so the app only loads machine code and carries no compiler
wasmtime = { version = "50.0.1", default-features = false, features = ["runtime", "std", "threads"] }

[build-dependencies]
wasmtime = { version = "50.0.1", default-features = false, features = ["cranelift", "all-arch", "std", "parallel-compilation", "threads"] }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[lints]
workspace = true

# AVFoundation camera capture; ScreenCaptureKit for the sound of a shared screen
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"

# Media Foundation camera capture, raw formats only: its MJPEG decoding would add another libjpeg
[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }
# Process loopback for the sound of a shared screen: everything playing except this app
wasapi = "0.27"
