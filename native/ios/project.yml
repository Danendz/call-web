# The Xcode project around the Rust app: `xcodegen` makes CallDanya.xcodeproj from this (it isn't committed).
# Xcode compiles nothing itself: build-rust.sh builds the app with cargo and puts the binary where Xcode's would go,
# then Xcode signs and installs the bundle as usual.
name: CallDanya
options:
  bundleIdPrefix: com.danendz
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CallDanya:
    type: application
    platform: iOS
    # Only the icon: the app itself is built by build-rust.sh
    sources:
      - Assets.xcassets
    settings:
      base:
        # Not xcodegen's `info:`, which writes the file over with its own
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.danendz.call-danya
        PRODUCT_NAME: CallDanya
        EXECUTABLE_NAME: call-danya
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Free Apple ID: pick your Personal Team in Xcode, or set it here
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Build the Rust app
        script: exec "$PROJECT_DIR/build-rust.sh"
        basedOnDependencyAnalysis: false
        # Named so Xcode signs the bundle again after each build, not only when it changed something itself
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
